  <script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme = stored;
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
